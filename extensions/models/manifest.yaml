manifestVersion: 1
name: "@mgreten/todoist-watcher"
version: "2026.06.26.1"
description: >
  Multi-machine Todoist task watcher and dispatcher: scans projects owned by the
  current machine for trigger-labelled tasks, respects per-project schedule
  windows, deduplicates work with TTL claims across machines, applies rate-limit
  backoff, and emits a structured dispatch list for a host executor.

